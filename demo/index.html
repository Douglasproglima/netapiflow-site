    <script>
      // Restores the real path after the root 404.html redirect (GitHub Pages has no server-side
      // SPA fallback). Must run before the app bundle below reads window.location.
      (function (l) {
        if (l.search && l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
